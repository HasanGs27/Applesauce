          + */
          +//! Copy with fixed memory use, including for very large IPA entries.
          +use std::io::{self, Read, Write};
          +
          +pub(super) fn copy<R: Read, W: Write>(source: &mut R, target: &mut W) -> io::Result<u64> {
          +    let mut buffer = [0u8; 64 * 1024];
          +    let mut total = 0u64;
          +    loop {
          +        let count = match source.read(&mut buffer) {
          +            Err(error) if error.kind() == io::ErrorKind::Interrupted => continue,
          +            result => result?,
          +        };
          +        if count == 0 {
          +            return Ok(total);
          +        }
          +        target.write_all(&buffer[..count])?;
          +        total = total.checked_add(count as u64)
          +            .ok_or_else(|| io::Error::new(io::ErrorKind::InvalidData, "Copy size overflow"))?;
          +    }
          +}
