      - name: Test bounded memory, seek, cache and copy errors
        run: cargo test --manifest-path tests/fifa13-io/Cargo.toml -- --test-threads=1

      - name: Validate patched Rust syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/fs.rs src/fs/bundle.rs src/fs/stream_copy.rs src/libc/malloc.rs src/frameworks/foundation/ns_file_manager.rs src/frameworks/foundation/ns_url_connection.rs platform/ios/rust-entry/src/lib.rs; do
            rustfmt --edition 2021 --emit stdout "$file" > /dev/null
          done

      - name: Build shared SDL2 for iPhone
        run: |
          sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build unsigned iOS app
        run: |
          export CARGO_PROFILE_RELEASE_DEBUG=2
          sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Give test build a separate identity
        run: |
          APP="build/host-iphoneos/Build/Products/Release-iphoneos/Applesauce.app"
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleIdentifier com.hasangs27.applesauce.fifa13ipafixv4" \
            "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleDisplayName Applesauce FIFA13 IPAFIX4" \
            "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleName Applesauce FIFA13 IPAFIX4" \
            "$APP/Info.plist" || true

      - name: Package unsigned IPA
        run: |
          mkdir -p dist
          sh platform/ios/scripts/package-ipa.sh \
            dist/Applesauce-FIFA13-IPAMetadataFixV4-unsigned.ipa

      - name: Verify IPA and checksum
        run: |
          test -s dist/Applesauce-FIFA13-IPAMetadataFixV4-unsigned.ipa
          unzip -tq dist/Applesauce-FIFA13-IPAMetadataFixV4-unsigned.ipa
          cd dist
          shasum -a 256 -c Applesauce-FIFA13-IPAMetadataFixV4-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Applesauce-FIFA13-IPAMetadataFixV4
          path: |
            dist/Applesauce-FIFA13-IPAMetadataFixV4-unsigned.ipa
            dist/Applesauce-FIFA13-IPAMetadataFixV4-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7

