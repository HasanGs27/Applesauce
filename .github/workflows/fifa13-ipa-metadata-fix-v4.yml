# Source pinned to the inspected ios-host revision; V2 run 33959922283.
# V2 left a dangling get_size() tail; this atomic unified diff replaces complete methods.
name: Build FIFA13 IPA-Metadata Fix V4 Applesauce

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: f1d72d33fd2ef9ca4af4ee48344c5bdf717b7602
          submodules: recursive
          persist-credentials: false

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: rustfmt

      - name: Install build dependencies
        run: |
          brew install cmake ninja boost
          echo "TOUCHHLE_BOOST_ROOT=$(brew --prefix boost)/include" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Apply verified FIFA13 bounded I/O patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/fifa13-v4.patch" <<'FIFA13_PATCH'
