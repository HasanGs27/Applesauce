          +#![allow(dead_code, non_camel_case_types, unused_imports)]
          +use std::cell::RefCell;
          +use std::collections::HashMap;
          +use std::fmt::Debug;
          +use std::io::{Read, Seek, Write};
          +use std::rc::Rc;
          +use zip::ZipArchive;
          +use std::alloc::{GlobalAlloc, Layout, System};
          +use std::sync::atomic::{AtomicUsize, Ordering};
          +static MAX_ALLOCATION: AtomicUsize = AtomicUsize::new(0);
          +struct TrackingAllocator;
          +unsafe impl GlobalAlloc for TrackingAllocator {
          +    unsafe fn alloc(&self, layout: Layout) -> *mut u8 {
          +        MAX_ALLOCATION.fetch_max(layout.size(), Ordering::SeqCst);
          +        System.alloc(layout)
          +    }
          +    unsafe fn dealloc(&self, ptr: *mut u8, layout: Layout) { System.dealloc(ptr, layout) }
          +    unsafe fn realloc(&self, ptr: *mut u8, layout: Layout, size: usize) -> *mut u8 {
          +        MAX_ALLOCATION.fetch_max(size, Ordering::SeqCst);
          +        System.realloc(ptr, layout, size)
          +    }
          +}
          +#[global_allocator]
          +static ALLOCATOR: TrackingAllocator = TrackingAllocator;
          +macro_rules! log { ($($arg:tt)*) => { eprintln!($($arg)*); }; }
          +// Only the unrelated guest calendar conversion is stubbed in this I/O harness.
          +type time_t = i32;
          +struct tm;
          +impl tm { fn from(_: u16, _: u8, _: u8, _: u8, _: u8, _: u8) -> Self { Self } }
          +fn calendar_date_to_timestamp(_: tm) -> i64 { 0 }
          +mod stream_copy;
          +mod ipa {
          +use super::*;
          +#[derive(Debug)]
          +struct ArchivedFileMetadata {
          +    /// Unix timestamp of file modification
          +    last_modified: i64,
          +    /// Uncompressed file size
          +    size: u64,
          +}
          +
          +/// Shared (refcounted) copy of the decompressed version of a file in an IPA.
          +///
          +/// Seeking in compressed files is hard, so the simple solution is to read the
          +/// whole file into memory. This is shared so having multiple copies of the same
          +/// file open won't waste memory.
          +type DecompressedFile = Rc<CachedIpaData>;
          +
          +/// Represents a file inside an IPA bundle that can be opened.
          +#[derive(Debug)]
          +pub struct IpaFileRef {
          +    archive: Rc<RefCell<ZipArchive<std::fs::File>>>,
          +    archive_files_cache: Rc<RefCell<HashMap<usize, DecompressedFile>>>,
          +    metadata_map: Rc<RefCell<HashMap<usize, ArchivedFileMetadata>>>,
          +    index: usize,
          +}
          +
          +impl IpaFileRef {
          +    pub fn open(&self) -> std::io::Result<IpaFile> {
          +        if let Some(cached) = self.archive_files_cache.borrow().get(&self.index) {
          +            return Ok(IpaFile { file: Rc::clone(cached), position: 0 });
          +        }
          +        let decoded = {
          +            let mut archive = self.archive.borrow_mut();
          +            let mut entry = archive.by_index(self.index)
          +                .map_err(|error| std::io::Error::new(std::io::ErrorKind::InvalidData, error))?;
          +            let size = entry.size();
          +            if size > 8 * 1024 * 1024 {
          +                log!("FIFA13-IO begin disk cache: entry={} name={:?} bytes={}",
          +                    self.index, entry.name(), size);
          +                // Anonymous temporary file: automatically deleted when its last handle closes.
          +                let mut disk = tempfile::tempfile()?;
          +                let copied = super::stream_copy::copy(&mut entry, &mut disk)?;
          +                if copied != size {
          +                    return Err(std::io::Error::new(std::io::ErrorKind::InvalidData,
          +                        "IPA entry length does not match ZIP metadata"));
          +                }
          +                disk.flush()?;
          +                log!("FIFA13-IO end disk cache: entry={} bytes={}", self.index, copied);
          +                CachedIpaData::Disk { file: RefCell::new(disk), size }
          +            } else {
          +                // Bound small-file allocation even if an archive reports an incorrect size.
          +                let mut bytes = Vec::new();
          +                entry.take(size + 1).read_to_end(&mut bytes)?;
          +                if bytes.len() as u64 != size {
          +                    return Err(std::io::Error::new(std::io::ErrorKind::InvalidData,
          +                        "IPA entry length does not match ZIP metadata"));
          +                }
          +                CachedIpaData::Memory(bytes)
          +            }
          +        };
          +        // Never cache a partial decode or turn an I/O failure into a successful empty file.
          +        let file = Rc::new(decoded);
          +        self.archive_files_cache.borrow_mut().insert(self.index, Rc::clone(&file));
          +        Ok(IpaFile { file, position: 0 })
          +    }
          +
          +    // ZIP headers contain both values; do not call open() or read payload data.
          +    fn ensure_metadata(&self) {
          +        if self.metadata_map.borrow().contains_key(&self.index) {
          +            return;
          +        }
          +        let metadata = {
          +            let mut archive = self.archive.borrow_mut();
          +            let result = match archive.by_index_raw(self.index) {
          +                Ok(file) => {
          +                    let modified = file.last_modified();
          +                    let date = tm::from(
          +                        modified.year(), modified.month(), modified.day(),
          +                        modified.hour(), modified.minute(), modified.second(),
          +                    );
          +                    Some(ArchivedFileMetadata {
          +                        last_modified: calendar_date_to_timestamp(date).into(),
          +                        size: file.size(),
          +                    })
          +                }
          +                Err(error) => {
          +                    log!("IPA metadata lookup failed for entry {}: {}", self.index, error);
          +                    None
          +                }
          +            };
          +            result
          +        };
          +        // Release the archive borrow before touching the metadata cache.
          +        // Failed lookups are not cached, allowing a later lookup to retry.
          +        if let Some(metadata) = metadata {
          +            self.metadata_map.borrow_mut().entry(self.index).or_insert(metadata);
          +        }
          +    }
          +
          +    pub fn get_last_modified(&self) -> time_t {
          +        self.ensure_metadata();
          +        self.metadata_map.borrow().get(&self.index)
          +            .map(|meta| meta.last_modified.try_into().unwrap_or_default())
          +            .unwrap_or_default()
          +    }
          +
          +    pub fn get_size(&self) -> u64 {
          +        self.ensure_metadata();
          +        self.metadata_map.borrow().get(&self.index)
          +            .map(|meta| meta.size).unwrap_or_default()
          +    }
          +}
          +
          +/// Shared decompressed data. Large entries live on disk instead of in RAM.
          +#[derive(Debug)]
          +enum CachedIpaData {
          +    Memory(Vec<u8>),
          +    Disk { file: RefCell<std::fs::File>, size: u64 },
          +}
          +
          +impl CachedIpaData {
          +    fn len(&self) -> u64 {
          +        match self {
          +            Self::Memory(bytes) => bytes.len() as u64,
          +            Self::Disk { size, .. } => *size,
          +        }
          +    }
          +}
          +
          +/// Each guest handle has an independent position, including cloned handles.
          +#[derive(Clone, Debug)]
          +pub struct IpaFile {
          +    file: DecompressedFile,
          +    position: u64,
          +}
          +
          +impl Read for IpaFile {
          +    fn read(&mut self, buf: &mut [u8]) -> std::io::Result<usize> {
          +        if self.position >= self.file.len() || buf.is_empty() {
          +            return Ok(0);
          +        }
          +        let count = match &*self.file {
          +            CachedIpaData::Memory(bytes) => {
          +                let start = self.position as usize;
          +                let count = buf.len().min(bytes.len() - start);
          +                buf[..count].copy_from_slice(&bytes[start..start + count]);
          +                count
          +            }
          +            CachedIpaData::Disk { file, .. } => {
          +                let mut file = file.borrow_mut();
          +                file.seek(std::io::SeekFrom::Start(self.position))?;
          +                file.read(buf)?
          +            }
          +        };
          +        self.position += count as u64;
          +        Ok(count)
          +    }
          +}
          +
          +impl Seek for IpaFile {
          +    fn seek(&mut self, pos: std::io::SeekFrom) -> std::io::Result<u64> {
          +        use std::io::SeekFrom;
          +        let next = match pos {
          +            SeekFrom::Start(offset) => offset as i128,
          +            SeekFrom::Current(offset) => self.position as i128 + offset as i128,
          +            SeekFrom::End(offset) => self.file.len() as i128 + offset as i128,
          +        };
          +        if !(0..=u64::MAX as i128).contains(&next) {
          +            return Err(std::io::Error::new(std::io::ErrorKind::InvalidInput,
          +                "Invalid IPA seek position"));
          +        }
          +        self.position = next as u64;
          +        Ok(self.position)
          +    }
          +}
          +#[cfg(test)]
          +mod tests {
          +    use super::*;
          +    use std::io::{SeekFrom, Write};
          +    use zip::write::FileOptions;
          +
          +    fn fixture(size: usize) -> IpaFileRef {
          +        let mut disk = tempfile::tempfile().unwrap();
          +        {
          +            let mut zip = zip::ZipWriter::new(&mut disk);
          +            zip.start_file("Payload/Test.app/data", FileOptions::default()
          +                .compression_method(zip::CompressionMethod::Deflated)).unwrap();
          +            let block: Vec<u8> = (0..65536).map(|i| (i % 251) as u8).collect();
          +            let mut remaining = size;
          +            while remaining > 0 {
          +                let count = remaining.min(block.len());
          +                zip.write_all(&block[..count]).unwrap();
          +                remaining -= count;
          +            }
          +            zip.finish().unwrap();
          +        }
          +        disk.rewind().unwrap();
          +        IpaFileRef {
          +            archive: Rc::new(RefCell::new(ZipArchive::new(disk).unwrap())),
          +            archive_files_cache: Rc::new(RefCell::new(HashMap::new())),
          +            metadata_map: Rc::new(RefCell::new(HashMap::new())), index: 0,
          +        }
          +    }
          +
          +    #[test]
          +    fn large_entry_metadata_does_not_decode() {
          +        let entry = fixture(16 * 1024 * 1024 + 17);
          +        assert_eq!(entry.get_size(), 16 * 1024 * 1024 + 17);
          +        let _ = entry.get_last_modified();
          +        assert!(entry.archive_files_cache.borrow().is_empty());
          +    }
          +
          +    #[test]
          +    fn large_entry_uses_disk_and_independent_cursors() {
          +        let size = 16 * 1024 * 1024 + 17;
          +        let entry = fixture(size);
          +        MAX_ALLOCATION.store(0, std::sync::atomic::Ordering::SeqCst);
          +        let mut first = entry.open().unwrap();
          +        let largest = MAX_ALLOCATION.load(std::sync::atomic::Ordering::SeqCst);
          +        assert!(largest < 1024 * 1024, "large allocation while decoding: {largest}");
          +        assert!(matches!(&*first.file, CachedIpaData::Disk { .. }));
          +        let mut second = entry.open().unwrap();
          +        assert!(Rc::ptr_eq(&first.file, &second.file));
          +        first.seek(SeekFrom::Start(3)).unwrap();
          +        let mut cloned = first.clone();
          +        let mut bytes = [0u8; 3];
          +        first.read_exact(&mut bytes).unwrap();
          +        assert_eq!(bytes, [3, 4, 5]);
          +        second.read_exact(&mut bytes).unwrap();
          +        assert_eq!(bytes, [0, 1, 2]);
          +        cloned.read_exact(&mut bytes).unwrap();
          +        assert_eq!(bytes, [3, 4, 5]);
          +        assert!(first.seek(SeekFrom::Start(0)).is_ok());
          +        assert!(first.seek(SeekFrom::Current(-1)).is_err());
          +        assert_eq!(first.seek(SeekFrom::End(5)).unwrap(), size as u64 + 5);
          +        assert_eq!(first.read(&mut bytes).unwrap(), 0);
          +        first.seek(SeekFrom::End(-3)).unwrap();
          +        first.read_exact(&mut bytes).unwrap();
          +        assert_eq!(bytes, [14, 15, 16]);
          +        first.rewind().unwrap();
          +        let mut dest = tempfile::tempfile().unwrap();
          +        assert_eq!(stream_copy::copy(&mut first, &mut dest).unwrap(), size as u64);
          +        assert_eq!(dest.metadata().unwrap().len(), size as u64);
          +    }
          +
          +    #[test]
          +    fn small_and_empty_entries_preserve_eof() {
          +        for size in [0, 19] {
          +            let entry = fixture(size);
          +            let mut file = entry.open().unwrap();
          +            assert!(matches!(&*file.file, CachedIpaData::Memory(_)));
          +            let mut bytes = Vec::new();
          +            file.read_to_end(&mut bytes).unwrap();
          +            assert_eq!(bytes.len(), size);
          +        }
          +    }
          +
          +    #[test]
          +    fn failed_entry_does_not_enter_cache() {
          +        let mut entry = fixture(19);
          +        entry.index = 999;
          +        assert!(entry.open().is_err());
          +        assert!(entry.archive_files_cache.borrow().is_empty());
          +    }
          +
          +    #[test]
          +    fn copy_retries_interruption_and_propagates_write_failure() {
          +        struct InterruptedOnce(bool);
          +        impl Read for InterruptedOnce {
          +            fn read(&mut self, bytes: &mut [u8]) -> std::io::Result<usize> {
          +                if !self.0 { self.0 = true; return Err(std::io::ErrorKind::Interrupted.into()); }
          +                bytes[0] = 7;
          +                Ok(1)
          +            }
          +        }
          +        struct FailingWriter;
          +        impl Write for FailingWriter {
          +            fn write(&mut self, _: &[u8]) -> std::io::Result<usize> {
          +                Err(std::io::ErrorKind::PermissionDenied.into())
          +            }
          +            fn flush(&mut self) -> std::io::Result<()> { Ok(()) }
          +        }
          +        assert_eq!(stream_copy::copy(&mut InterruptedOnce(false), &mut FailingWriter)
          +            .unwrap_err().kind(), std::io::ErrorKind::PermissionDenied);
          +    }
          +}
          +
